# Corrección: Se arregló la sintaxis YAML. Faltaban corchetes "[ ]", "pull_request" estaba mal escrito, y faltaban los guiones "-" en los steps.
name: CI Java Maven
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compilar y ejecutar pruebas
        run: mvn clean test

        